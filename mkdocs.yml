site_name: Guard.IA — Documentação
site_description: Plataforma de monitoramento legislativo para proteção de crianças e adolescentes na internet.
site_author: Squad 5 — MDS 2026/1 (UnB)
site_url: https://unb-mds.github.io/2026-1-Guard.IA/
repo_name: unb-mds/2026-1-Guard.IA
repo_url: https://github.com/unb-mds/2026-1-Guard.IA

theme:
  name: material
  language: pt
  palette:
    - scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/weather-night
        name: Mudar para modo escuro
    - scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/weather-sunny
        name: Mudar para modo claro
  font:
    text: Nunito
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: pt

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Início: index.md
  - Pipeline:
      - Visão Geral: pipeline/visao_geral.md
      - Arquitetura Pipes and Filters: pipeline/arquitetura.md
  - Tecnologias:
      - Stack do Projeto: tecnologias/stack.md
      - Banco de Dados: tecnologias/banco.md
      - Autenticação: tecnologias/autenticacao.md
  - Sprints:
      - Sprint 00 — Nivelamento: sprints/sprint00.md
      - Sprint 01 — Estudos Técnicos: sprints/sprint01.md
      - Sprint 02 — Requisitos e Story Map: sprints/sprint02.md
      - Sprint 03 — Primeiro Desenvolvimento: sprints/sprint03.md
      - Sprint 04 — UX e DevOps: sprints/sprint04.md
      - Sprint 05 — Integração Final: sprints/sprint05.md
  - Equipe: equipe/index.md
  - Produtividade: produtividade.md
  - Release Notes: release_notes.md
